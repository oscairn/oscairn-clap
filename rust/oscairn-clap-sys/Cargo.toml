[package]
name = "oscairn-clap-sys"
description = "Raw FFI bindings for the Oscairn CLAP extension headers, generated with bindgen"
version.workspace = true
edition.workspace = true
license = "MIT"
repository.workspace = true

[features]
# Regenerates src/bindings.rs from the headers with bindgen (needs libclang).
generate = ["dep:bindgen"]

[build-dependencies]
bindgen = { version = "=0.73.2", optional = true }

[dev-dependencies]
clap-sys = "=0.5.0"
