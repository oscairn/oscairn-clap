name: rust
on:
  push:
    paths: ["rust/**", "include/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", "include/**", ".github/workflows/rust.yml"]
jobs:
  bindings-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - name: Install libclang (bindgen)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: Regenerate the bindings; they must not change
        working-directory: rust
        run: |
          cargo build -p oscairn-clap-sys --features generate
          git diff --exit-code -- oscairn-clap-sys/src/bindings.rs
      - name: cargo test with generate
        working-directory: rust
        run: cargo test -p oscairn-clap-sys --features generate
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: cargo test
        working-directory: rust
        run: cargo test --workspace
      - name: Build the example bundle
        working-directory: rust
        run: |
          cargo build --release -p ui-hints
          if [ "$RUNNER_OS" = macOS ]; then
            mkdir -p target/ui-hints.clap/Contents/MacOS
            cp target/release/libui_hints.dylib target/ui-hints.clap/Contents/MacOS/ui-hints
          else
            cp target/release/libui_hints.so target/ui-hints.clap
          fi
